name: Chang7 upstream sync
# GITHUB_TOKEN cannot modify workflow files. For those updates, configure
# UPSTREAM_SYNC_TOKEN with Contents: write and Workflows: write,
# restricted to this repository (or the three managed forks).
# A missing/underprivileged token is a failure, never a successful sync.
# Set UPSTREAM_SYNC_BASELINE to the full SHA of the reviewed fork overlay commit.
# It must include this workflow and all approved fork changes; never auto-advance it.
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/chang7-upstream-sync.yml'
permissions:
  contents: write
concurrency:
  group: chang7-upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository_owner == 'Chang7' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve user edits and merge upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          SYNC_TOKEN_CONFIGURED: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          EXPECTED_REPOSITORY_ID: '1261970017'
          UPSTREAM_SYNC_BASELINE: ${{ vars.UPSTREAM_SYNC_BASELINE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import base64
          import re
          import subprocess
          import tempfile
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          from urllib.parse import quote
          
          MANAGED = '.github/workflows/chang7-upstream-sync.yml'
          
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          
          def request(method, path, data=None):
              req = Request('https://api.github.com' + path, method=method,
                            data=json.dumps(data).encode() if data is not None else None,
                            headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                     'Accept': 'application/vnd.github+json',
                                     'X-GitHub-Api-Version': '2026-03-10',
                                     'Content-Type': 'application/json'})
              try:
                  with build_opener(NoRedirect).open(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except HTTPError as error:
                  if error.code != 404:
                      body = error.read(8192).decode('utf-8', errors='replace')
                      body = body.replace(os.environ['GH_TOKEN'], '[REDACTED]')
                      print(json.dumps({
                          'status': 'API_ERROR', 'method': method, 'path': path,
                          'http_status': error.code, 'response': body,
                          'request_id': error.headers.get('X-GitHub-Request-Id'),
                          'accepted_permissions': error.headers.get('X-Accepted-GitHub-Permissions'),
                          'rate_limit_remaining': error.headers.get('X-RateLimit-Remaining'),
                          'retry_after': error.headers.get('Retry-After')}), flush=True)
                  raise
          
          def git(work, env, *args):
              result = subprocess.run(['git', '-C', work, *args], env=env,
                                      text=True, capture_output=True, timeout=180)
              if result.returncode:
                  detail = result.stderr + result.stdout
                  header = env.get('GIT_CONFIG_VALUE_0', '')
                  for secret in (env.get('GH_TOKEN'), header, header.removeprefix('AUTHORIZATION: basic ')):
                      if secret:
                          detail = detail.replace(secret, '[REDACTED]')
                  raise RuntimeError('git ' + args[0] + ' failed: ' + detail[:8192])
              return result.stdout.strip()
          
          def reviewed_baseline(env):
              baseline = env.get('UPSTREAM_SYNC_BASELINE', '')
              if not re.fullmatch(r'[0-9a-f]{40}', baseline):
                  raise RuntimeError('BLOCKED_BASELINE: set UPSTREAM_SYNC_BASELINE to the full SHA '
                                     'of the reviewed fork overlay commit; no push attempted')
              return baseline
          
          def reviewed_tree(work, baseline, upstream, env):
              tree = git(work, env, 'merge-tree', '--write-tree', baseline, upstream).splitlines()[0]
              if not re.fullmatch(r'[0-9a-f]{40}', tree):
                  raise RuntimeError('Unexpected merge tree')
              return tree
          
          def merge_candidate(work, before, source, env):
              baseline = reviewed_baseline(env)
              git(work, env, 'merge-base', '--is-ancestor', baseline, before)
              if not git(work, env, 'ls-tree', baseline, '--', MANAGED):
                  raise RuntimeError('BLOCKED_BASELINE: reviewed commit must include this workflow')
              if git(work, env, 'ls-tree', source, '--', MANAGED):
                  raise RuntimeError('Upstream uses managed workflow path; review required')
              # Compare complete trees, including this workflow, against the immutable
              # reviewed overlay plus upstream already integrated into the fork.
              # A clean merge is required; arbitrary subsequent fork edits are refused.
              base = git(work, env, 'merge-base', before, source)
              expected_before = reviewed_tree(work, baseline, base, env)
              if git(work, env, 'rev-parse', before + '^{tree}') != expected_before:
                  raise RuntimeError('User changes detected outside reviewed baseline; automatic sync stopped')
              if base == source:
                  return before
              expected_after = reviewed_tree(work, baseline, source, env)
              tree = reviewed_tree(work, before, source, env)
              if tree != expected_after:
                  raise RuntimeError('Unexpected merged content; refusing to push')
              candidate = git(work, env, 'commit-tree', tree, '-p', before, '-p', source,
                              '-m', 'chore(sync): merge upstream ' + source[:12])
              git(work, env, 'merge-base', '--is-ancestor', before, candidate)
              git(work, env, 'merge-base', '--is-ancestor', source, candidate)
              if git(work, env, 'ls-tree', before, '--', MANAGED) != git(work, env, 'ls-tree', candidate, '--', MANAGED):
                  raise RuntimeError('Managed workflow changed during merge')
              return candidate
          
          def require_workflow_token(work, before, candidate, env):
              paths = git(work, env, 'diff', '--no-renames', '--name-only', '-z', before, candidate).split('\0')
              workflows = [path for path in paths if path.startswith('.github/workflows/')]
              if workflows and env.get('SYNC_TOKEN_CONFIGURED') != 'true':
                  raise RuntimeError('BLOCKED_WORKFLOW_PERMISSION: GITHUB_TOKEN cannot update workflows. '
                                     'Set the UPSTREAM_SYNC_TOKEN Actions secret to a token limited to this repository '
                                     'with Contents: write and Workflows: write, then run this workflow again. '
                                     'No push attempted. Affected files: ' + json.dumps(workflows))
          
          def native_merge(name, branch, before, source):
              if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', name):
                  raise RuntimeError('Invalid repository name')
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (before, source)):
                  raise RuntimeError('Invalid pinned commit')
              baseline = reviewed_baseline(os.environ)
              url = 'https://github.com/' + name + '.git'
              auth = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
              env = dict(os.environ, GIT_TERMINAL_PROMPT='0', GIT_CONFIG_NOSYSTEM='1',
                         GIT_CONFIG_GLOBAL='/dev/null', GIT_CONFIG_COUNT='2',
                         GIT_CONFIG_KEY_0='http.' + url + '.extraheader',
                         GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + auth,
                         GIT_CONFIG_KEY_1='core.hooksPath', GIT_CONFIG_VALUE_1='/dev/null',
                         GIT_AUTHOR_NAME='github-actions[bot]',
                         GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
                         GIT_COMMITTER_NAME='github-actions[bot]',
                         GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
              with tempfile.TemporaryDirectory() as work:
                  git(work, env, 'init', '--bare', '-q')
                  git(work, env, 'remote', 'add', 'origin', url)
                  git(work, env, 'config', 'remote.origin.promisor', 'true')
                  git(work, env, 'config', 'remote.origin.partialclonefilter', 'blob:none')
                  git(work, env, 'fetch', '--no-tags', '--filter=blob:none', 'origin', before, source, baseline)
                  candidate = merge_candidate(work, before, source, env)
                  current = request('GET', '/repos/' + name + '/branches/' + quote(branch, safe=''))['commit']['sha']
                  if current != before:
                      raise RuntimeError('Target moved during validation; retry from a fresh snapshot')
                  if candidate == before:
                      return {'sha': before}
                  require_workflow_token(work, before, candidate, env)
                  # Never force. GitHub's normal permission and branch-policy checks apply.
                  git(work, env, 'push', 'origin', candidate + ':refs/heads/' + branch)
                  return {'sha': candidate}
          
          def main():
              name = os.environ['GITHUB_REPOSITORY']
              repo = request('GET', '/repos/' + name)
              assert repo['owner']['login'].lower() == 'chang7', 'Wrong owner'
              assert str(repo['id']) == os.environ['EXPECTED_REPOSITORY_ID'], 'Wrong repository ID'
              assert repo['fork'] and not repo['archived'] and not repo['disabled'], 'Inactive fork'
              parent = repo['parent']
              branch = repo['default_branch']
              before = request('GET', '/repos/' + name + '/branches/' + quote(branch, safe=''))['commit']['sha']
              source = request('GET', '/repos/' + parent['full_name'] + '/branches/' + quote(parent['default_branch'], safe=''))['commit']['sha']
              # Never merge an upstream version of the executable maintenance workflow.
              try:
                  request('GET', '/repos/' + parent['full_name'] + '/contents/' + MANAGED + '?ref=' + source)
              except HTTPError as error:
                  if error.code != 404:
                      raise
              else:
                  raise RuntimeError('Upstream uses managed workflow path; review required')
              merged = native_merge(name, branch, before, source)
              if merged['sha'] == before:
                  print('UP_TO_DATE: ' + name + ' upstream=' + source + ' baseline=' + reviewed_baseline(os.environ))
                  return
              after = request('GET', '/repos/' + name + '/branches/' + quote(branch, safe=''))['commit']['sha']
              verify = request('GET', '/repos/' + name + '/compare/' + source + '...' + after)
              assert verify['behind_by'] == 0, 'Upstream is not included in target'
              assert after == merged['sha'], 'Target moved after push; inspect current history'
              preserved = request('GET', '/repos/' + name + '/compare/' + before + '...' + after)
              assert preserved['behind_by'] == 0, 'Previous fork history is not included in target'
              print(json.dumps({'status': 'SYNCED', 'repo': name, 'before': before, 'upstream': source,
                                'after': after, 'merge': merged.get('sha')}))
          
          if __name__ == '__main__':
              main()
          PY

